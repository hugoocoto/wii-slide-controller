name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev
      - run: make CFLAGS="-std=c99 -Wall -Wextra -Werror -O2 -Ilib/virt.h -Ilib/wiimote.h"
      - run: tar czf wii-slide-controller-${GITHUB_REF_NAME}-linux-x86_64.tar.gz wii-slide-controller README.md LICENSE
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes wii-slide-controller-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
